<!doctype html>
<html lang="en">
<head>

<title>Lab 3A · Crypto-Shredding</title>
<style>
:root{
  --navy:#14213D; --navy-2:#22304F; --teal:#1F7A6D; --teal-soft:#E3EEEA; --cream:#F5F4EF;

}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cream);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
main{display:flex;flex-direction:column;gap:16px;min-width:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--teal)}

.grid-wrap{overflow-x:auto}

input.name{border:1px solid #CFCCC3;border-radius:10px;padding:9px 12px;width:min(380px,100%);background:#fff}

.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}

@media (max-width:1180px){
  .app{grid-template-columns:1fr}
  nav{position:static;flex-direction:row;flex-wrap:wrap}
  nav .group{display:none}
  aside.system{position:static}
}

<body>
<header>
  <div class="brand"><span>Data Privacy · Lab 3A</span>Crypto-Shredding: the VitaLink simulation</div>
  <div class="who" id="who"></div>
</header>
<div class="app">
  <nav id="nav"></nav>
  <main id="main"></main>
  <aside class="system" id="system"></aside>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* =========================================================================
   Scenario data (matches the lab slides 07-08)
   ========================================================================= */
const PATIENTS = [
  {patient_id:"P001", name:"Anna Becker",     email:"anna.becker@mail.de",     zip:"10115", dob:"1985-03-12", sex:"F", diagnosis:"Asthma",                    clinic_region:"EU"},
  {patient_id:"P002", name:"Luca Rossi",      email:"luca.rossi@mail.it",      zip:"20121", dob:"1972-11-02", sex:"M", diagnosis:"Hypertension",              clinic_region:"EU"},
  {patient_id:"P003", name:"Sofia Lindqvist", email:"sofia.lindqvist@mail.se", zip:"11122", dob:"1990-07-24", sex:"F", diagnosis:"Major depressive disorder", clinic_region:"EU"},
  {patient_id:"P004", name:"James Carter",    email:"james.carter@mail.com",   zip:"02139", dob:"1968-01-30", sex:"M", diagnosis:"Asthma",                    clinic_region:"US"},
  {patient_id:"P005", name:"Maria Lopez",     email:"maria.lopez@mail.com",    zip:"90012", dob:"1995-05-17", sex:"F", diagnosis:"Type 2 diabetes",           clinic_region:"US"},
  {patient_id:"P006", name:"David Kim",       email:"david.kim@mail.com",      zip:"60601", dob:"1980-09-09", sex:"M", diagnosis:"Migraine",                  clinic_region:"US"},
];
const PIDS = PATIENTS.map(p => p.patient_id);
const P = id => PATIENTS.find(p => p.patient_id === id);
const FIELDS = ["patient_id","name","email","zip","dob","sex","diagnosis","clinic_region"];
const SIX = ["name","email","zip","dob","sex","diagnosis"];
const LOCS = [
  {id:"primary", file:"patients.csv",              short:"patients.csv",  fields:FIELDS},
  {id:"backup1", file:"backups/snapshot_day1.csv", short:"snapshot_day1", fields:FIELDS},
  {id:"backup2", file:"backups/snapshot_day2.csv", short:"snapshot_day2", fields:FIELDS},
  {id:"index",   file:"search_index.json",         short:"search_index",  fields:["patient_id","name","diagnosis"]},
  {id:"audit",   file:"audit_log.jsonl",           short:"audit_log",     fields:["patient_id"]},
];
const DIAG_LOCS = ["primary","backup1","backup2","index"];
const ACCESSES = [["dr_weber","P001"],["dr_weber","P003"],["nurse_li","P004"],["dr_weber","P003"],["dr_hale","P006"]];
const FOCUS = "P003";

/* =========================================================================
   Byte helpers, SHA-256 and HMAC (self-contained, works offline)
   ========================================================================= */
const utf8 = new TextEncoder();
function randBytes(n){ const b = new Uint8Array(n); crypto.getRandomValues(b); return b; }
function concat(...parts){ const len = parts.reduce((a,p)=>a+p.length,0); const out = new Uint8Array(len); let o=0; for(const p of parts){ out.set(p,o); o+=p.length; } return out; }
function b64url(bytes){ let s=""; for(const x of bytes) s+=String.fromCharCode(x); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_"); }
function unb64url(str){ const s = atob(str.replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from(s, c => c.charCodeAt(0)); }
function hex(bytes){ return Array.from(bytes, b => b.toString(16).padStart(2,"0")).join(""); }
function isPrime(n){ for(let i=2;i*i<=n;i++) if(n%i===0) return false; return true; }
function firstPrimes(count){ const out=[]; for(let n=2; out.length<count; n++) if(isPrime(n)) out.push(n); return out; }
const SHA_K = firstPrimes(64).map(p => Math.floor((Math.cbrt(p) % 1) * 4294967296) >>> 0);
const SHA_H = firstPrimes(8).map(p => Math.floor((Math.sqrt(p) % 1) * 4294967296) >>> 0);
function ror(x,n){ return (x>>>n) | (x<<(32-n)); }
function sha256(msg){
  const l = msg.length, padLen = ((l + 9 + 63) >> 6) << 6;
  const m = new Uint8Array(padLen); m.set(msg); m[l] = 0x80;
  const dv = new DataView(m.buffer);
  dv.setUint32(padLen-8, Math.floor(l / 0x20000000)); dv.setUint32(padLen-4, (l << 3) >>> 0);
  const H = SHA_H.slice(), w = new Uint32Array(64);
  for(let o=0; o<padLen; o+=64){
    for(let i=0;i<16;i++) w[i] = dv.getUint32(o + i*4);
    for(let i=16;i<64;i++){
      const a=w[i-15], b=w[i-2];
      const s0 = ror(a,7) ^ ror(a,18) ^ (a>>>3), s1 = ror(b,17) ^ ror(b,19) ^ (b>>>10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
    }
    let [a,b,c,d,e,f,g,h] = H;
    for(let i=0;i<64;i++){
      const S1 = ror(e,6) ^ ror(e,11) ^ ror(e,25), ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + SHA_K[i] + w[i]) >>> 0;
      const S0 = ror(a,2) ^ ror(a,13) ^ ror(a,22), mj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + mj) >>> 0;
      h=g; g=f; f=e; e=(d+t1)>>>0; d=c; c=b; b=a; a=(t1+t2)>>>0;
    }
    H[0]=(H[0]+a)>>>0; H[1]=(H[1]+b)>>>0; H[2]=(H[2]+c)>>>0; H[3]=(H[3]+d)>>>0;
    H[4]=(H[4]+e)>>>0; H[5]=(H[5]+f)>>>0; H[6]=(H[6]+g)>>>0; H[7]=(H[7]+h)>>>0;
  }
  const out = new Uint8Array(32), odv = new DataView(out.buffer);
  H.forEach((x,i) => odv.setUint32(i*4, x));
  return out;
}
function hmac(key, msg){
  let k = key.length > 64 ? sha256(key) : key;
  const block = new Uint8Array(64); block.set(k);
  const ipad = block.map(b => b ^ 0x36), opad = block.map(b => b ^ 0x5c);
  return sha256(concat(opad, sha256(concat(ipad, msg))));
}
const sha256hex = str => hex(sha256(utf8.encode(str)));
const hmacHex = (key, str) => hex(hmac(typeof key === "string" ? utf8.encode(key) : key, utf8.encode(str)));

/* Fernet-shaped tokens. Real Fernet layout: version(1) | timestamp(8) | IV(16) | ciphertext | HMAC(32).
   The simulation never needs to decrypt: whether a token is readable is decided by whether its key exists. */
function newKey(){ return b64url(randBytes(32)); }
function makeToken(text){
  const ctLen = (Math.floor(utf8.encode(text).length / 16) + 1) * 16;
  const ts = new Uint8Array(8); new DataView(ts.buffer).setUint32(4, Math.floor(Date.now()/1000));
  return b64url(concat(new Uint8Array([0x80]), ts, randBytes(16), randBytes(ctLen), randBytes(32)));
}
function tokenSeconds(token){ const b = unb64url(token), dv = new DataView(b.buffer); return dv.getUint32(1) * 4294967296 + dv.getUint32(5); }
const fp = key => sha256hex(key).slice(0,16);
const short = (tok, n=14) => tok.length > n ? tok.slice(0,n) + "…" : tok;

/* =========================================================================
   The simulated VitaLink system
   ========================================================================= */
function newSystem(opts = {}){
  const s = {keyMode:null, keys:{}, regionKeys:{}, enc:[], tokens:{}, tokenKey:{}, rows:{},
             audit:[], auditMode:"id", cache:null, pending:null, day:0, extra:{}, panel:null};
  LOCS.forEach(l => s.rows[l.id] = PIDS.slice());
  s.audit = ACCESSES.map(([actor,pid]) => ({actor, action:"read", patient_id:pid}));
  if(opts.keys) makeKeys(s, opts.keys);
  if(opts.enc) encryptFields(s, opts.enc);
  return s;
}
function makeKeys(s, mode){
  s.keyMode = mode; s.keys = {};
  if(mode === "per") PIDS.forEach(pid => s.keys[pid] = newKey());
  else { s.regionKeys = {EU:newKey(), US:newKey()}; PATIENTS.forEach(p => s.keys[p.patient_id] = s.regionKeys[p.clinic_region]); }
}
function encryptFields(s, fields){
  s.enc = fields.slice();
  PATIENTS.forEach(p => {
    const pid = p.patient_id; s.tokens[pid] = {};
    fields.forEach(f => s.tokens[pid][f] = makeToken(p[f]));
    s.tokenKey[pid] = s.keys[pid];
  });
}
function appKeys(s){
  if(!s.pending) return s.keys;
  const k = {}; for(const pid in s.keys) if(!(pid in s.pending)) k[pid] = s.keys[pid]; return k;
}
const keyAlive = (s, key) => !!key && Object.values(s.keys).includes(key);
const canRead = (s, pid) => { const k = appKeys(s)[pid]; return !!k && k === s.tokenKey[pid]; };

function cellState(s, loc, pid, f){
  if(loc === "audit"){
    if(f !== "patient_id") return {kind:"na"};
    if(s.auditMode === "pseudo"){
      if(!ACCESSES.some(a => a[1] === pid)) return {kind:"none"};
      return {kind: keyAlive(s, s.tokenKey[pid]) ? "pseudo" : "orphanlog"};
    }
    return s.audit.some(l => l.patient_id === pid) ? {kind:"plain", value:pid} : {kind:"none"};
  }
  const L = LOCS.find(l => l.id === loc);
  if(!L.fields.includes(f)) return {kind:"na"};
  if(!s.rows[loc].includes(pid)) return {kind:"absent"};
  if(s.enc.includes(f)){
    const tok = s.tokens[pid][f];
    if(canRead(s, pid)) return {kind:"ok", value:tok};
    if(keyAlive(s, s.tokenKey[pid])) return {kind: (s.pending && pid in s.pending) ? "disabled" : "orphan", value:tok};
    return {kind:"dead", value:tok};
  }
  return {kind:"plain", value:P(pid)[f]};
}
function exposure(s, pid){
  const r = {};
  LOCS.forEach(L => r[L.id] = L.fields.filter(f => cellState(s, L.id, pid, f).kind === "plain").length);
  return r;
}
function readDiag(s, loc, pid){
  const c = cellState(s, loc, pid, "diagnosis");
  return (c.kind === "ok" || c.kind === "plain") ? P(pid).diagnosis : null;
}
function readCounts(s){
  const c = {}; PIDS.forEach(pid => c[pid] = DIAG_LOCS.filter(l => readDiag(s, l, pid) === P(pid).diagnosis).length); return c;
}
function fileText(s, loc){
  if(loc === "audit") return s.audit.map(l => JSON.stringify(l)).join("\n");
  const L = LOCS.find(l => l.id === loc);
  const rows = s.rows[loc].map(pid => {
    const r = {}; L.fields.forEach(f => r[f] = s.enc.includes(f) ? s.tokens[pid][f] : P(pid)[f]);
    if(loc === "index" && s.extra.bidx) r.name_bidx = s.extra.bidx[pid];
    return r;
  });
  return loc === "index" ? JSON.stringify(rows) : rows.map(r => L.fields.map(f => r[f]).join(",")).join("\n");
}
function fileHashes(s){ const h = {}; LOCS.forEach(L => h[L.id] = sha256hex(fileText(s, L.id))); return h; }
function searchName(s, name){
  return s.rows.index.filter(pid => cellState(s, "index", pid, "name").kind === "plain" && P(pid).name === name);
}
function eqScan(r, arr){ return LOCS.every((L,i) => r[L.id] === arr[i]); }

/* =========================================================================
   Output helpers for the console
   ========================================================================= */
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ok   = t => `<div class="line ok"><span class="ico">✓</span><span>${t}</span></div>`;
const warn = t => `<div class="line warn"><span class="ico">⚠</span><span>${t}</span></div>`;
const info = t => `<div class="line"><span class="ico">›</span><span>${t}</span></div>`;
const pre  = t => `<pre>${esc(t)}</pre>`;
const scanText = r => LOCS.map(L => `${L.short} <b>${r[L.id]}</b>`).join(" · ");

/* =========================================================================
   The exercises
   ========================================================================= */
const STEPS = [
{
  id:"p1", group:"Lab", nav:"1 · Naive delete", eyebrow:"Part 1 · 20 min", title:"The naive delete",
  intro:"VitaLink keeps every patient in five files: the main database, two backups, a search index and an audit log. Patient P003, Sofia Lindqvist, has asked to be erased. A developer does the obvious thing and deletes her row from the main database.",
  setup:() => newSystem(),
  predict:"A developer erases P003 by deleting the row from patients.csv. How many of the five locations still expose P003, and which fields?",
  actions:[
    {label:"Scan all five files for P003's data", code:'exposure_scan("P003")', run:s => {
      const r = exposure(s, FOCUS);
      return [info(`Plaintext fields for P003: ${scanText(r)}`),
              eqScan(r,[8,8,8,3,1]) ? ok("Checkpoint reached: 8, 8, 8, 3 and 1, as on the slide.") : info("This does not match the slide checkpoint.")];
    }},
    {label:"Delete P003's row from patients.csv", code:'naive_delete("P003")', run:s => {
      s.rows.primary = s.rows.primary.filter(pid => pid !== FOCUS);
      return [info(`Rows left in patients.csv: ${s.rows.primary.join(", ")}`),
              info(`Plaintext fields for P003 now: ${scanText(exposure(s, FOCUS))}`)];
    }},
  ],
  explains:["Why does a loop that deletes from every file still fail in a real system?",
            "What does a clean scan prove, and not prove?"],
},
{
  id:"p2", group:"Lab", nav:"2 · Per-patient keys", eyebrow:"Part 2 · 30 min", title:"Per-patient keys, encrypt at write",

function bidxSearch(s, name){ const t = hmacHex(s.extra.ikey, name.trim().toLowerCase()); return s.rows.index.filter(pid => s.extra.bidx[pid] === t); }
function auditRef(s, pid){ return hmacHex(s.keys[pid], "audit-log").slice(0,16); }
function findAccesses(s, pid){ if(!(pid in s.keys)) return []; const r = auditRef(s, pid); return s.audit.filter(l => l.subject === r); }
function advance(s, days){
  s.day += days; const gone = [];
  for(const pid of Object.keys(s.pending)){ s.pending[pid] -= days; if(s.pending[pid] <= 0){ delete s.pending[pid]; delete s.keys[pid]; gone.push(pid); } }
  return gone;
}

/* Step-specific side panels */
function panelBackup(s){
  const b = s.extra.backup;
  return `<h3>Key-store backup and tombstones</h3><div class="panel-list">
    <div>Nightly backup: ${b ? Object.keys(b).map(p => `<span class="key"><b>${p}</b></span>`).join(" ") : '<span class="note">not taken yet</span>'}</div>
    <div>Tombstones (erased IDs): ${s.extra.tomb.length ? s.extra.tomb.map(p => `<b>${p}</b>`).join(", ") : '<span class="note">none</span>'}</div></div>`;
}
function panelCache(s){
  const e = Object.entries(s.cache);
  return `<h3>App cache (decrypted values)</h3><div class="panel-list">${e.length ? e.map(([p,v]) => `<div><b>${p}</b> → <span class="cell k-plain">${esc(v)}</span></div>`).join("") : '<span class="note">empty</span>'}</div>`;
}
function panelLog(s){
  return `<h3>erasure_log.jsonl</h3><div class="panel-list">${s.extra.log.length ? s.extra.log.map(r => `<div class="mono">${esc(JSON.stringify(r))}</div>`).join("") : '<span class="note">empty</span>'}</div>`;
}
function panelIndex(s){
  return `<h3>search_index.json · name_bidx column</h3><div class="panel-list">${s.rows.index.map(p => `<div><b>${p}</b> <span class="mono">${s.extra.bidx[p].slice(0,28)}…</span></div>`).join("")}</div>`;
}
function panelAudit(s){
  return `<h3>audit_log.jsonl</h3><div class="panel-list">${s.audit.map(l => {
    const owner = PIDS.find(pid => pid in s.keys && auditRef(s,pid) === l.subject);
    return `<div class="mono">{"actor": "${l.actor}", "subject": "${l.subject}"} <span class="note">${owner ? "→ " + owner : "→ no match"}</span></div>`;
  }).join("")}</div>`;
}
function panelVault(s){
  return `<h3>KMS vault · day ${s.day}</h3><div class="panel-list">${PIDS.map(pid => {
    const st = !(pid in s.keys) ? '<span class="cell k-dead">destroyed</span>' : (pid in s.pending ? `<span class="cell k-disabled">disabled, ${s.pending[pid]} days left</span>` : '<span class="cell k-ok">active</span>');
    return `<div><b>${pid}</b> ${st}</div>`;
  }).join("")}</div>`;
}

function ans(id){ return store.answers[id] || (store.answers[id] = {predict:"", locked:false, explains:[], ran:false}); }
const MIN = 15;
const filled = t => (t || "").trim().length >= MIN;
function stepStatus(st){
  const a = store.answers[st.id]; if(!a) return "";
  if(a.ran && filled(a.predict) && st.explains.every((_,i) => filled(a.explains[i]))) return "done";
  return (a.predict || a.ran) ? "started" : "";
}

/* =========================================================================
   Rendering
   ========================================================================= */
let current = "start", sys = null, ran = 0, output = [];
const $ = id => document.getElementById(id);

function renderNav(){
  let html = `<button data-go="start" class="${current==="start"?"active":""}"><span class="dot ${store.name?"done":""}"></span>Start here</button>`;
  let group = "";
  STEPS.forEach(st => {
    if(st.group !== group){ group = st.group; html += `<div class="group">${group === "Lab" ? "The lab" : "Extra exercises"}</div>`; }
    html += `<button data-go="${st.id}" class="${current===st.id?"active":""}"><span class="dot ${stepStatus(st)}"></span>${st.nav}</button>`;
  });
  html += `<div class="group">Finish</div><button data-go="finish" class="${current==="finish"?"active":""}"><span class="dot"></span>Hand in answers</button>`;
  $("nav").innerHTML = html;
  $("nav").querySelectorAll("button").forEach(b => b.onclick = () => go(b.dataset.go));
  $("who").textContent = store.name ? `Student: ${store.name}` : "";
}

function go(id){
  current = id; ran = 0; output = [];
  const st = STEPS.find(s => s.id === id);
  sys = st ? st.setup() : null;
  render(); window.scrollTo(0,0);
}

function render(){
  renderNav();
  if(current === "start") return renderStart();
  if(current === "finish") return renderFinish();
  renderStep(); renderSystem();
}

function renderStart(){
  $("system").innerHTML = "";
  $("main").innerHTML = `<div class="card welcome">
    <div class="eyebrow">Lab 3A · Crypto-Shredding</div>
    <h1>Erase a patient by destroying one key</h1>
    <p>VitaLink is a fictional telehealth platform. Patient <b>P003, Sofia Lindqvist</b>, has asked to be erased. Your job is to make that true, prove it, find what it missed, and then break it.</p>
    <p><b>How every part works</b></p>
    <ol>
      <li><b>Predict</b>: before anything runs, write what you think will happen. It is marked on reasoning, not on being right.</li>
      <li><b>Run</b>: click the actions one by one. The panel on the right shows the five files and the key store changing.</li>
      <li><b>Explain</b>: write what you saw and why, especially where it differed from your prediction.</li>
    </ol>
    <p>Your prediction locks once you run the first action. Answers are kept in this browser on this computer, but <b>copy them into Notepad at the end of each part</b> to be safe.</p>
    <p class="note">This is a simulation that runs entirely in your browser. Keys, tokens and hashes behave like the Python Fernet code in the lab.</p>
    <div style="border-left:6px solid var(--teal);background:var(--teal-soft);border-radius:10px;padding:12px 16px;margin:10px 0">
      <p style="margin:0 0 4px"><b>Your data in this lab</b></p>
      <p style="margin:0">Nothing you type is sent anywhere. Your name and answers stay in this browser, on this computer, so you can carry on if the page closes. You hand them in yourself at the end, using <b>Hand in answers</b>.</p>
    </div>
    <p class="q">Your full name</p>
    <input class="name" id="name" placeholder="First and last name" value="${esc(store.name)}">
    <div class="btnrow"><button class="btn" id="begin">Start Part 1</button></div>
  </div>`;
  $("name").oninput = e => { store.name = e.target.value; save(); renderNav(); };
  $("begin").onclick = () => go("p1");
}

function renderStep(){
  const st = STEPS.find(s => s.id === current), a = ans(st.id);
  const idx = STEPS.indexOf(st), next = STEPS[idx+1] ? STEPS[idx+1].id : "finish";
  $("main").innerHTML = `
    <div class="card">
      <div class="eyebrow">${st.eyebrow}</div>
      <h1>${st.title}</h1>
      <p>${st.intro}</p>
    </div>
    <div class="card">
      <h2><span class="pill predict">Predict</span> Write it down first</h2>
      <p class="q">${st.predict}</p>
      <textarea id="predict" placeholder="Your prediction, in one to three sentences…">${esc(a.predict)}</textarea>
      <div id="predictNote"></div>
    </div>
    <div class="card">
      <h2><span class="pill run">Run</span> Click the actions in order</h2>
      <div class="actions" id="actions"></div>
      <div style="height:12px"></div>
      <div class="console" id="console"></div>
    </div>
    <div class="card">
      <h2><span class="pill explain">Explain</span> Say what you saw</h2>
      ${st.explains.map((q,i) => `<p class="q">${i+1}. ${q}</p><textarea data-ex="${i}" placeholder="Two to five sentences…">${esc(a.explains[i]||"")}</textarea>`).join("")}
      <div id="explainNote" class="hint"></div>
    </div>
    <div class="footer-row">
      <span class="note">Answers save automatically as you type.</span>
      <button class="btn navy" id="next">Save and continue →</button>
    </div>`;
  $("predict").oninput = e => { a.predict = e.target.value; save(); renderActions(); renderNav(); };
  document.querySelectorAll("textarea[data-ex]").forEach(t => t.oninput = e => { a.explains[+t.dataset.ex] = e.target.value; save(); renderNav(); });
  $("next").onclick = () => go(next);
  renderActions(); renderConsole();
}

function renderActions(){
  const st = STEPS.find(s => s.id === current), a = ans(st.id);
  const canStart = a.locked || filled(a.predict);
  $("predict").disabled = a.locked;
  $("predictNote").innerHTML = a.locked ? `<div class="locked">🔒 Prediction locked. It stays as you wrote it, even if it was wrong.</div>`
                                        : `<div class="hint">Write at least one full sentence to unlock the actions. Wrong predictions are fine.</div>`;
  $("actions").innerHTML = st.actions.map((act,i) => `
    <div class="act ${i < ran ? "done" : ""}">
      <span class="n">${i < ran ? "✓" : i+1}</span>
      <div class="lbl">${act.label}<code>${esc(act.code)}</code></div>
      <button class="btn" data-act="${i}" ${(i !== ran || !canStart) ? "disabled" : ""}>${i < ran ? "Done" : "Run"}</button>
    </div>`).join("");
  $("actions").querySelectorAll("button[data-act]").forEach(b => b.onclick = () => runAction(+b.dataset.act));
  const allRan = ran >= st.actions.length || a.ran;
  document.querySelectorAll("textarea[data-ex]").forEach(t => t.disabled = !allRan);
  $("explainNote").textContent = allRan ? "" : "These unlock after you have run every action.";
}

function runAction(i){
  const st = STEPS.find(s => s.id === current), a = ans(st.id);
  if(i === 0){ a.locked = true; }
  output.push(`<div class="step">› ${esc(st.actions[i].code)}</div>`, ...st.actions[i].run(sys));
  ran = i + 1;
  if(ran >= st.actions.length) a.ran = true;
  save(); renderActions(); renderConsole(); renderSystem(); renderNav();
}

function renderConsole(){
  $("console").innerHTML = output.length ? output.join("") : `<span class="empty">Output appears here when you run an action.</span>`;
}

const LABEL = {plain:"👁 plaintext", ok:"🔓 readable", dead:"🔒 unreadable", orphan:"🔒 no key entry", disabled:"⏸ key disabled",
               absent:"— row deleted", none:"·", pseudo:"🔓 pseudonym", orphanlog:"🔒 pseudonym"};

function renderSystem(){
  const s = sys;
  let keys;
  if(!s.keyMode) keys = `<span class="note">No keys yet. Everything is stored in plaintext.</span>`;
  else if(s.keyMode === "shared"){
    keys = ["EU","US"].map(r => {
      const k = s.regionKeys[r], alive = keyAlive(s, k), users = PIDS.filter(pid => s.keys[pid] === k);
      return `<span class="key ${alive ? "" : "gone"}"><b>${r} key</b> <span class="fp">${fp(k).slice(0,10)}</span> · entries: ${users.join(", ") || "none"}</span>`;
    }).join("");
  } else {
    keys = PIDS.map(pid => {
      if(!(pid in s.keys)) return `<span class="key gone"><b>${pid}</b> destroyed</span>`;
      if(s.pending && pid in s.pending) return `<span class="key wait"><b>${pid}</b> ⏳ ${s.pending[pid]}d</span>`;
      return `<span class="key"><b>${pid}</b> <span class="fp">${fp(s.keys[pid]).slice(0,10)}</span></span>`;
    }).join("");
  }
  const head = `<tr><th>Patient</th>${LOCS.map(L => `<th title="${L.file}">${L.short}</th>`).join("")}</tr>`;
  const rows = PIDS.map(pid => `<tr class="${pid===FOCUS?"focus":""}"><td>${pid}</td>${LOCS.map(L => {
    const c = cellState(s, L.id, pid, L.id === "audit" ? "patient_id" : "diagnosis");
    return `<td><span class="cell k-${c.kind}">${LABEL[c.kind] || ""}</span></td>`;
  }).join("")}</tr>`).join("");
  const detail = LOCS.map(L => {
    let chips;
    if(L.id === "audit"){
      const c = cellState(s, "audit", FOCUS, "patient_id");
      const n = ACCESSES.filter(x => x[1] === FOCUS).length;
      chips = c.kind === "plain" ? `<span class="chip k-plain">patient_id: P003 (${n} lines)</span>`
            : `<span class="chip k-${c.kind}">${c.kind === "pseudo" ? "pseudonym (her key exists)" : "pseudonym (her key is gone)"} (${n} lines)</span>`;
    } else if(!s.rows[L.id].includes(FOCUS)) chips = `<span class="chip k-absent">row deleted</span>`;
    else chips = L.fields.map(f => {
      const c = cellState(s, L.id, FOCUS, f);
      return c.kind === "plain" ? `<span class="chip k-plain">${f}: ${esc(c.value)}</span>`
                                : `<span class="chip tok k-${c.kind}" title="${c.value}">${f}: ${short(c.value, 12)}</span>`;
    }).join("");
    return `<div class="dloc"><span class="fname">${L.file}</span><div class="chips">${chips}</div></div>`;
  }).join("");
  const scan = exposure(s, FOCUS);
  const hideDetail = ["p2","p3"].includes(current);   // Part 4 asks students to predict this
  $("system").innerHTML = `
    <div class="card"><h3>Key store</h3><div class="keys">${keys}</div></div>
    <div class="card"><h3>The five files · diagnosis per patient</h3>
      <div class="grid-wrap"><table class="grid">${head}${rows}</table></div>
      <div class="legend"><span class="cell k-plain">👁 plaintext</span><span class="cell k-ok">🔓 readable</span><span class="cell k-dead">🔒 unreadable</span><span class="cell k-orphan">🔒 no key entry</span></div>
      <p class="note" style="margin-top:6px">audit_log stores no diagnosis; that column shows whether P00x's ID appears in it.</p></div>
    ${hideDetail ? "" : `<div class="card"><h3>P003 in each file · plaintext fields: ${LOCS.map(L => scan[L.id]).join(", ")}</h3><div class="detail">${detail}</div></div>`}
    ${s.panel ? `<div class="card">${s.panel(s)}</div>` : ""}`;
}

function answersText(){
  const lines = ["Lab 3A - Crypto-Shredding: answers", `Name: ${store.name || "(not given)"}`, `Saved: ${new Date().toLocaleString()}`, ""];
  STEPS.forEach(st => {
    const a = store.answers[st.id] || {explains:[]};
    lines.push("=".repeat(60), `${st.eyebrow}: ${st.title}`, "=".repeat(60));
    lines.push(`PREDICT: ${st.predict}`, `> ${(a.predict || "").trim() || "(no answer)"}`, "");
    st.explains.forEach((q,i) => lines.push(`EXPLAIN ${i+1}: ${q}`, `> ${((a.explains||[])[i] || "").trim() || "(no answer)"}`, ""));
    lines.push(`Actions completed: ${a.ran ? "yes" : "no"}`, "");
  });
  return lines.join("\r\n");
}

function renderFinish(){
  $("system").innerHTML = "";
  const rows = STEPS.map(st => {
    const s = stepStatus(st);
    return `<div class="row"><span>${st.eyebrow}: ${st.title}</span><span class="${s==="done"?"yes":"no"}">${s==="done"?"complete":(s?"in progress":"not started")}</span></div>`;
  }).join("");
  $("main").innerHTML = `<div class="card">
    <div class="eyebrow">Finish</div><h1>Hand in your answers</h1>
    <p>Check your name, then copy your answers into Notepad and save the file as <b>Lab3A_YourName.txt</b>. Or download the text file directly.</p>
    <p class="q">Your full name</p><input class="name" id="name2" value="${esc(store.name)}" placeholder="First and last name">
    <div class="btnrow"><button class="btn" id="copy">Copy all my answers</button><button class="btn ghost" id="dl">Download as .txt</button></div>
    <div class="status-list">${rows}</div>
    <p class="q" style="margin-top:14px">Everything you wrote (you can also select it and press Ctrl+C):</p>
    <textarea id="all" style="min-height:280px;font-family:var(--mono);font-size:13px" readonly></textarea>
  </div>`;
  $("all").value = answersText();
  $("name2").oninput = e => { store.name = e.target.value; save(); renderNav(); $("all").value = answersText(); };
  $("copy").onclick = copyAll;
  $("dl").onclick = () => {
    const blob = new Blob([answersText()], {type:"text/plain"}), a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `Lab3A_${(store.name || "answers").replace(/[^A-Za-z0-9]+/g,"_")}.txt`;
    document.body.appendChild(a); a.click(); a.remove(); toast("Downloaded. Check your Downloads folder.");
  };
}

function copyAll(){
  const t = $("all"); t.value = answersText();
  const fallback = () => { t.focus(); t.select(); let done = false; try { done = document.execCommand("copy"); } catch(e) {}
    toast(done ? "Copied. Paste it into Notepad with Ctrl+V." : "Select the text below and press Ctrl+C."); };
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t.value).then(() => toast("Copied. Paste it into Notepad with Ctrl+V."), fallback);
  else fallback();
}
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 2600); }

render();
</script>
</body>
</html>
